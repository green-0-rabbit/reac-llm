#cloud-config
# Updated: using xfce4 for lightweight RDP compatibility
package_update: true
package_upgrade: false

packages:
  - xfce4
  - xfce4-goodies
  - xorgxrdp
  - firefox
  - docker.io
  - jq
  - openssl
  - curl
  - wget
  - gnupg
  - software-properties-common
  - unzip
  - postgresql-client
  - xrdp
  - git
  - python3-pip
  - python3-venv
  - python-is-python3

write_files:
  - path: /etc/sbx.env
    permissions: "0600"
    owner: root:root
    content: |
      %{ for key, value in env_vars ~}
      ${key}=${value}
      %{ endfor ~}

runcmd:
  # Format data disk if needed
  - [ bash, -c, 'mkfs.ext4 -F /dev/disk/azure/scsi1/lun0 2>/dev/null || true' ]
  # Enable docker
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, docker ]
  # Install Azure CLI (fast one-liner)
  - [ bash, -c, 'curl -sL https://aka.ms/InstallAzureCLIDeb | bash' ]
  # Install Terraform
  - [ bash, -c, 'wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | tee /usr/share/keyrings/hashicorp-archive-keyring.gpg' ]
  - [ bash, -c, 'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list' ]
  - [ apt-get, update ]
  - [ apt-get, install, -y, terraform ]
  # Install Just
  - [ bash, -c, 'curl --proto "=https" --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin' ]
  # Install Node.js (Latest LTS) and Yarn (Berry)
  - [ bash, -c, 'curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -' ]
  - [ apt-get, install, -y, nodejs ]
  - [ corepack, enable ]
  # Install Chezmoi
  - [ bash, -c, 'sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin' ]
  # Install VS Code
  - [ snap, install, code, --classic ]
  # Enable RDP for GUI access via Azure Bastion
  - [ systemctl, enable, --now, xrdp ]
  - [ bash, -c, 'adduser xrdp ssl-cert || true' ]
  # Configure XFCE for XRDP
  - [ bash, -c, 'echo "startxfce4" > /etc/xrdp/startwm.sh' ]
  - [ chmod, 755, /etc/xrdp/startwm.sh ]
  # Fix permissions for XRDP SSL key to prevent connection errors
  - [ chgrp, ssl-cert, /etc/xrdp/key.pem ]
  - [ chmod, 640, /etc/xrdp/key.pem ]
  # Fix Firefox Snap visibility in XFCE menu
  - [ bash, -c, 'ln -s /var/lib/snapd/desktop/applications/firefox_firefox.desktop /usr/share/applications/firefox.desktop || true' ]
  # Fix VS Code Snap visibility in XFCE menu
  - [ bash, -c, 'ln -s /var/lib/snapd/desktop/applications/code_code.desktop /usr/share/applications/code.desktop || true' ]
  - [ systemctl, restart, xrdp ]
